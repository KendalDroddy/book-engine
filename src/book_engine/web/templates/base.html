<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Book Engine{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/library" aria-label="Book Engine library">
      <span class="brand-mark" aria-hidden="true">B</span>
      <span><strong>Book Engine</strong><small>A personal reading archive</small></span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="/library"{% if request.url.path == '/library' %} aria-current="page"{% endif %}>Library</a>
      <a href="/recommendations"{% if request.url.path.startswith('/recommendations') %} aria-current="page"{% endif %}>Recommendations</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>Local, private, and built around the books.</span></footer>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</body>
</html>
